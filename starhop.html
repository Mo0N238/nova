<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5fc2ff"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Starhop</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1d2a;--paper:#fff8ec;--sun:#ffd23f;--pink:#ff5fa2}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#5fc2ff;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);touch-action:none}
#stage{position:relative;width:100%}
#stage{background:#5fc2ff;overflow:hidden}
#cv{display:block}
#hud{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:8px;right:8px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;pointer-events:none}
#hud span{background:rgba(255,255,255,.85);border:2px solid var(--ink);border-radius:999px;padding:0 9px}
#hud button{pointer-events:auto;margin-left:auto;width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:#fff;font:800 14px 'Baloo 2';box-shadow:0 3px 0 var(--ink)}
#pad{position:fixed;left:0;right:0;bottom:0;height:min(220px,30vh);background:linear-gradient(#ffcf5c,#ff9a5c);border-top:4px solid var(--ink);display:flex;justify-content:space-between;align-items:center;padding:0 min(18px,3vw) calc(env(safe-area-inset-bottom) + 6px)}
body.shortvp #pad{padding-bottom:6px}
body:not(.portrait) #pad{background:none;border:none;height:auto;bottom:10px;align-items:flex-end;pointer-events:none}
body:not(.portrait) #pad .grp{pointer-events:auto}
.grp{display:flex;gap:min(14px,3vw);align-items:center}
.pb{width:min(74px,19vw);height:min(74px,19vw);border-radius:50%;border:4px solid var(--ink);background:#fff;font:800 26px 'Baloo 2';color:var(--ink);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;touch-action:none}
.pb.jump{width:min(92px,24vw);height:min(92px,24vw);background:var(--pink);color:#fff}
.pb.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);filter:brightness(.92)}
body:not(.portrait) .pb{opacity:.75;width:64px;height:64px}
body:not(.portrait) .pb.jump{width:80px;height:80px}
#swipe{position:fixed;inset:0;display:none;z-index:1}
body.swipe #swipe{display:block}
body.swipe #pad .grp{visibility:hidden}
body.swipe #pad::after{content:'⟵ drag left side to move · tap right side to jump · swipe down to slam ⟶';position:absolute;left:0;right:0;text-align:center;font-weight:700;font-size:13px;opacity:.8}
body.swipe:not(.portrait) #pad::after{bottom:4px;color:#fff;text-shadow:0 1px 2px #000}
#hud{z-index:2}
.screen{position:fixed;inset:0;z-index:5;overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 20px);text-align:center}
#title{background:linear-gradient(#6cc8ff,#c9f0ff 55%,#9be28f 55.2%,#7cd36e)}
.logo{font-size:64px;font-weight:800;letter-spacing:1px;color:#fff;-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink);margin:30px 0 4px;line-height:1}
.tag{font-weight:700;margin-bottom:10px}
#tArt{width:200px;height:90px;margin:10px auto 20px;display:block}
button.big{display:block;margin:10px auto;min-width:220px;height:56px;border-radius:18px;border:4px solid var(--ink);background:var(--sun);font:800 22px 'Baloo 2';color:var(--ink);box-shadow:0 6px 0 var(--ink)}
button.big.alt{background:#fff;font-size:18px;height:48px}
button.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.exit{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;z-index:6;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);background:#fff;font:800 18px 'Baloo 2';box-shadow:0 3px 0 var(--ink)}
#select{background:linear-gradient(#ffcf5c,#ff8a5c)}
h2{font-size:34px;font-weight:800;margin:6px 0 10px;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:0 4px 0 var(--ink)}
#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:720px;margin:0 auto}
.hcard{background:var(--paper);border:4px solid var(--ink);border-radius:20px;padding:8px 8px 12px;font-family:inherit;color:var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;align-items:center}
.hcard.on{background:#fff;outline:4px solid #fff;transform:translateY(-4px)}
.hcard canvas{width:80px;height:75px}
.hcard b{font-size:22px;line-height:1}
.hcard .mv{background:var(--pink);color:#fff;border-radius:999px;padding:0 10px;font-weight:800;font-size:13px;margin:4px 0}
.hcard small{font-size:12px;font-weight:600;opacity:.8;line-height:1.2;min-height:30px}
.bars{width:100%;margin-top:6px;font-size:11px;font-weight:700}
.bars div{display:flex;justify-content:space-between}.bars u{text-decoration:none;color:#ffb100;letter-spacing:1px}.bars em{color:rgba(43,29,42,.15);font-style:normal}
#map{background:linear-gradient(#bfeaff,#fff8ec)}
.world{border:4px solid var(--ink);border-radius:20px;padding:10px;margin:0 auto 12px;max-width:560px;box-shadow:0 5px 0 var(--ink);color:#fff;text-align:left}
.world b{font-size:20px;-webkit-text-stroke:1px var(--ink);text-shadow:0 2px 0 var(--ink)}
.lv{display:flex;gap:8px;margin-top:6px}
.lv button{flex:1;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);font-family:inherit;padding:6px 2px;box-shadow:0 3px 0 var(--ink);min-height:84px}
.lv button:disabled{background:rgba(255,255,255,.55);box-shadow:none}
.lv span{display:block;font-weight:800;font-size:18px}.lv small{display:block;font-size:11px;font-weight:700;line-height:1.1}.lv em{display:block;font-style:normal;font-size:11px;font-weight:700}
#mapTotal{font-weight:800;margin-bottom:10px}
#pause,#result{background:rgba(43,29,42,.55);display:flex;flex-direction:column;justify-content:center}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:16px;max-width:340px;margin:0 auto;box-shadow:0 6px 0 var(--ink)}
.card h2{margin-top:0}.card p{font-weight:700;font-size:16px}
.seg{display:flex;gap:6px;justify-content:center;margin:8px 0}
.seg button{border:3px solid var(--ink);border-radius:12px;background:#fff;font:800 15px 'Baloo 2';padding:6px 12px}
.seg button.on{background:var(--sun)}
</style></head>
<body>
<div id="stage"><canvas id="cv"></canvas>
  <div id="hud" hidden><span id="hHearts">❤️❤️❤️</span><span id="hStars">⭐ 0</span><span id="hGems">🌟 0/3</span><button id="pauseBtn" aria-label="Pause">❚❚</button></div>
</div>
<div id="swipe"></div>
<div id="pad" hidden>
  <div class="grp"><button class="pb" data-k="left" aria-label="Left">◀</button><button class="pb" data-k="right" aria-label="Right">▶</button></div>
  <div class="grp"><button class="pb" data-k="down" aria-label="Down">⬇</button><button class="pb jump" data-k="jump" aria-label="Jump">⤒</button></div>
</div>
<div class="screen" id="title"><button class="exit" aria-label="Back to Nova">✕</button>
  <div class="logo">Starhop</div><div class="tag">Hop, bop and collect every star.</div>
  <canvas id="tArt" width="400" height="180"></canvas>
  <button class="big" id="playBtn">▶ Play</button>
</div>
<div class="screen" id="select" hidden><button class="exit" aria-label="Back to Nova">✕</button>
  <h2>Choose your hero</h2><div id="cards"></div><button class="big" id="goMap" style="margin-top:16px">Let's go! ▶</button>
</div>
<div class="screen" id="map" hidden><button class="exit" aria-label="Back to Nova">✕</button>
  <h2 style="color:#fff">World map</h2><div id="mapTotal"></div><div id="worlds"></div><button class="big alt" id="mapBack">↺ Change hero</button>
</div>
<div class="screen" id="pause" hidden><div class="card"><h2>Paused</h2>
  <div style="font-weight:800">Controls</div><div class="seg"><button data-ctl="buttons">🎮 Buttons</button><button data-ctl="swipe">👆 Swipe</button></div>
  <button class="big alt" id="sndBtn">🔊 Sound on</button><button class="big" id="resume">▶ Resume</button><button class="big alt" id="quitLvl">🗺 Quit to map</button><button class="big alt exit" style="position:static;width:auto;height:48px;border-radius:18px;margin:10px auto;display:block;min-width:220px">✕ Back to Nova</button></div></div>
<div class="screen" id="result" hidden><div class="card"><h2></h2><p></p><div class="btns"></div></div></div>
<script>
const INK = '#2b1d2a';
function shape(g, fill, fn, lw = 3){ g.beginPath(); fn(); g.fillStyle = fill; g.fill(); g.lineWidth = lw; g.strokeStyle = INK; g.lineJoin = 'round'; g.stroke(); }
const ell = (g, x, y, rx, ry, rot = 0) => () => g.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot, 0, Math.PI*2);
const rr  = (g, x, y, w, h, r) => () => g.roundRect(x, y, w, h, r);
function limb(g, x, y, ang, w, h, fill, foot){ g.save(); g.translate(x, y); g.rotate(ang); shape(g, fill, rr(g, -w/2, 0, w, h, w/2)); if(foot) foot(); g.restore(); }
function eye(g, x, y, rx, ry, blink){ if(blink){ g.beginPath(); g.moveTo(x-rx, y); g.quadraticCurveTo(x, y+ry*.6, x+rx, y); g.lineWidth = 2.5; g.strokeStyle = INK; g.stroke(); return; }
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); g.fillStyle = INK; g.fill();
  g.beginPath(); g.arc(x + rx*.35, y - ry*.4, rx*.38, 0, Math.PI*2); g.fillStyle = '#fff'; g.fill(); }
function happyEye(g, x, y, r){ g.beginPath(); g.arc(x, y + r*.4, r, Math.PI*1.15, Math.PI*1.85); g.lineWidth = 2.6; g.strokeStyle = INK; g.lineCap = 'round'; g.stroke(); }

// pose: {run:0..1 phase or null, air:-1(rising)..1(falling) or null, t:time}
// all heroes are drawn with their feet at (0,0), facing right, about 80 units tall
const DRAW = {
  pip(g, p){
    const s = p.run != null ? Math.sin(p.run*Math.PI*2) : 0, bob = p.run != null ? -Math.abs(s)*3 : Math.sin(p.t*3)*1.2;
    const blink = (p.t % 3.2) < .12;
    g.translate(0, bob);
    // tail
    g.save(); g.translate(-11, -24); g.rotate(-.5 + Math.sin(p.t*(p.run != null ? 14 : 4))*.18 + (p.air != null ? .5 : 0));
    shape(g, '#f08a24', () => { g.moveTo(0,0); g.bezierCurveTo(-10,-2,-26,-14,-30,-30); g.bezierCurveTo(-20,-28,-6,-20,4,-8); g.closePath(); });
    shape(g, '#fff4e0', () => { g.moveTo(-24,-21); g.bezierCurveTo(-27,-25,-29,-28,-30,-30); g.bezierCurveTo(-26,-30,-22,-27,-19,-24); g.closePath(); });
    g.restore();
    // legs
    const legA = p.air != null ? (p.air < 0 ? -.9 : .5) : s*.8, legB = p.air != null ? (p.air < 0 ? .6 : -.3) : -s*.8;
    const boot = () => shape(g, '#5a3a22', rr(g, -5, 13, 13, 7, 3));
    limb(g, -3, -18, legB, 8, 16, '#d9701a', boot);
    // back arm
    limb(g, -4, -38, p.air != null && p.air < 0 ? -2.6 : -s*.9, 6, 13, '#d9701a');
    // body
    shape(g, '#f08a24', ell(g, 0, -29, 13, 15));
    shape(g, '#fff4e0', ell(g, 4, -26, 8, 10), 2.5);
    // satchel
    g.beginPath(); g.moveTo(-10,-41); g.lineTo(9,-19); g.lineWidth = 3.5; g.strokeStyle = '#7a4a2a'; g.stroke();
    shape(g, '#a8683a', rr(g, 3, -24, 13, 11, 3), 2.5);
    limb(g, 4, -18, legA, 8, 16, '#f08a24', boot);
    // scarf + flowing end
    const wave = Math.sin(p.t*10)*3;
    shape(g, '#e23b3b', () => { g.moveTo(-6,-43); g.bezierCurveTo(-16,-44+wave,-24,-38-wave,-30,-41+wave*1.2); g.lineTo(-28,-35+wave); g.bezierCurveTo(-20,-33,-14,-37,-6,-37); g.closePath(); });
    shape(g, '#e23b3b', rr(g, -10, -46, 22, 8, 4));
    // front arm
    limb(g, 6, -38, p.air != null && p.air < 0 ? -2.4 : s*.9, 6, 13, '#f08a24');
    // head
    g.save(); g.translate(2, -58);
    shape(g, '#f08a24', () => { g.moveTo(-12,-6); g.lineTo(-10,-24); g.lineTo(-1,-12); g.closePath(); });
    shape(g, '#f08a24', () => { g.moveTo(3,-12); g.lineTo(10,-25); g.lineTo(14,-7); g.closePath(); });
    shape(g, '#f08a24', ell(g, 0, 0, 15, 14));
    shape(g, '#fff4e0', () => { g.moveTo(2,4); g.bezierCurveTo(8,12,20,8,22,1); g.bezierCurveTo(16,-2,8,-2,2,4); g.closePath(); }, 2.5);
    g.beginPath(); g.arc(21, 0, 2.6, 0, Math.PI*2); g.fillStyle = INK; g.fill();
    if(p.air != null && p.air < 0) happyEye(g, 8, -3, 3.6); else eye(g, 8, -3, 2.6, 3.8, blink);
    g.beginPath(); g.ellipse(-3, 4, 3.5, 2.2, 0, 0, Math.PI*2); g.fillStyle = 'rgba(226,59,59,.35)'; g.fill();
    // goggles
    g.beginPath(); g.moveTo(-14,-7); g.quadraticCurveTo(0,-14,14,-9); g.lineWidth = 4; g.strokeStyle = '#3b2a3a'; g.stroke();
    shape(g, '#6ad1ff', ell(g, 5, -11, 5.2, 4.6), 2.8);
    g.beginPath(); g.arc(6.5, -12.5, 1.6, 0, Math.PI*2); g.fillStyle = '#fff'; g.fill();
    g.restore();
  },
  bolt(g, p){
    const s = p.run != null ? Math.sin(p.run*Math.PI*2) : 0, bob = p.run != null ? -Math.abs(s)*2.5 : Math.sin(p.t*2.5)*1.5;
    g.translate(0, bob);
    // rocket flame when in the air
    if(p.air != null){ const f = 10 + Math.random()*6; [-7, 7].forEach(x => { g.beginPath(); g.moveTo(x-5, -2); g.quadraticCurveTo(x, f+6, x+5, -2); g.closePath(); g.fillStyle = '#ffb84a'; g.fill(); g.beginPath(); g.moveTo(x-2.5, -2); g.quadraticCurveTo(x, f-2, x+2.5, -2); g.fillStyle = '#fff3b0'; g.fill(); }); }
    // legs + boots
    const la = p.air != null ? .15 : s*.5, lb = p.air != null ? -.15 : -s*.5;
    const boot = () => shape(g, '#ff8a3d', rr(g, -7, 9, 15, 8, 4));
    limb(g, -7, -16, lb, 5, 11, '#8a9bb0', boot);
    limb(g, 7, -16, la, 5, 11, '#8a9bb0', boot);
    // arms
    const arm = (x, a) => limb(g, x, -40, a, 5, 13, '#8a9bb0', () => shape(g, '#2ec4b6', ell(g, 0, 14, 4.5, 4.5), 2.5));
    arm(-17, p.air != null && p.air < 0 ? 2.6 : .25 - s*.6);
    // body
    shape(g, '#2ec4b6', rr(g, -16, -46, 32, 32, 10));
    shape(g, '#e8f6f4', rr(g, -8, -38, 16, 9, 3), 2.5);
    [[-4,'#ff5a7a'],[1,'#ffd23f'],[6,'#7cf29c']].forEach(([x,c]) => { g.beginPath(); g.arc(x, -33.5, 1.8, 0, Math.PI*2); g.fillStyle = (Math.floor(p.t*4) % 3 === [-4,1,6].indexOf(x)) ? c : '#9bb'; g.fill(); });
    arm(17, p.air != null && p.air < 0 ? -2.6 : -.25 + s*.6);
    // antenna
    const sway = Math.sin(p.t*5)*(p.run != null ? .3 : .12);
    g.save(); g.translate(0, -76); g.rotate(sway);
    g.beginPath(); g.moveTo(0,0); g.lineTo(0,-13); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
    g.shadowColor = '#ffe66b'; g.shadowBlur = 12 + Math.sin(p.t*6)*5; shape(g, '#ffe66b', ell(g, 0, -16, 5, 5), 2.5); g.shadowBlur = 0;
    g.restore();
    // head / screen
    shape(g, '#dfe7ee', rr(g, -20, -78, 40, 32, 11));
    shape(g, '#1d2b3a', rr(g, -15, -73, 30, 22, 7), 2);
    g.fillStyle = '#5ff2ff'; g.shadowColor = '#5ff2ff'; g.shadowBlur = 6;
    if(p.air != null && p.air < 0){ [-6, 6].forEach(x => { g.beginPath(); g.arc(x, -59, 4, Math.PI, 0); g.lineWidth = 2.8; g.strokeStyle = '#5ff2ff'; g.stroke(); }); }
    else { const bl = (p.t % 2.8) < .12; [-6, 6].forEach(x => g.fillRect(x-2.5, bl ? -62 : -66, 5, bl ? 2 : 9)); }
    g.shadowBlur = 0;
    g.beginPath(); g.ellipse(-11, -55, 2.5, 1.6, 0, 0, Math.PI*2); g.ellipse(11, -55, 2.5, 1.6, 0, 0, Math.PI*2); g.fillStyle = 'rgba(255,120,160,.55)'; g.fill();
  },
  mochi(g, p){
    let sx = 1, sy = 1;
    if(p.run != null){ const b = Math.sin(p.run*Math.PI*2); sy = 1 + b*.1; sx = 1 - b*.08; }
    else if(p.air != null){ sy = p.air < 0 ? 1.18 : .95; sx = p.air < 0 ? .86 : 1.05; }
    else { const b = Math.sin(p.t*2.4); sy = 1 + b*.035; sx = 1 - b*.03; }
    const hop = p.run != null ? -Math.max(0, Math.sin(p.run*Math.PI*2))*7 : 0;
    g.translate(0, hop);
    // feet
    const fa = p.run != null ? Math.sin(p.run*Math.PI*2)*4 : 0;
    shape(g, '#f3d9b8', ell(g, -9 - fa, -2, 7, 4.5));
    shape(g, '#f3d9b8', ell(g, 9 + fa, -2, 7, 4.5));
    // body
    const R = 25;
    shape(g, '#fff1dc', ell(g, 0, -R*sy - 2, R*sx*1.1, R*sy));
    g.beginPath(); g.ellipse(-9*sx, -R*sy*1.55, 6, 3.5, -.5, 0, Math.PI*2); g.fillStyle = 'rgba(255,255,255,.9)'; g.fill();
    // leaf sprout
    const top = -R*sy*2 - 2, sw = Math.sin(p.t*3)*.15 + (p.air != null ? (p.air < 0 ? -.4 : .3) : 0);
    g.save(); g.translate(0, top + 2); g.rotate(sw);
    g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(2,-7,0,-12); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
    shape(g, '#7bd36b', () => { g.moveTo(0,-11); g.bezierCurveTo(6,-22,18,-20,20,-14); g.bezierCurveTo(14,-8,5,-8,0,-11); g.closePath(); }, 2.5);
    shape(g, '#5dbb52', () => { g.moveTo(0,-11); g.bezierCurveTo(-5,-19,-14,-18,-15,-13); g.bezierCurveTo(-10,-8,-4,-9,0,-11); g.closePath(); }, 2.5);
    g.restore();
    // face
    const fy = -R*sy - 2;
    if(p.air != null && p.air < 0){ happyEye(g, 0, fy - 4, 4); happyEye(g, 14, fy - 4, 4); }
    else { const bl = (p.t % 3.5) < .12; eye(g, 1, fy - 3, 3.2, 4.4, bl); eye(g, 15, fy - 3, 3.2, 4.4, bl); }
    g.beginPath(); g.ellipse(-6, fy + 5, 4.5, 2.6, 0, 0, Math.PI*2); g.ellipse(21, fy + 5, 4, 2.6, 0, 0, Math.PI*2); g.fillStyle = 'rgba(255,120,150,.5)'; g.fill();
    g.beginPath(); g.moveTo(5, fy + 4); g.quadraticCurveTo(6.5, fy + 7, 8, fy + 4); g.quadraticCurveTo(9.5, fy + 7, 11, fy + 4); g.lineWidth = 2.2; g.strokeStyle = INK; g.lineCap = 'round'; g.stroke();
  },
  kai(g, p){
    const s = p.run != null ? Math.sin(p.run*Math.PI*2) : 0, bob = p.run != null ? -Math.abs(s)*3 : Math.sin(p.t*2.8)*1.2;
    g.translate(0, bob);
    // backpack
    shape(g, '#ff9f43', rr(g, -21, -46, 13, 22, 5));
    g.beginPath(); g.moveTo(-19,-36); g.lineTo(-10,-36); g.lineWidth = 2.5; g.strokeStyle = INK; g.stroke();
    // legs
    const legA = p.air != null ? (p.air < 0 ? -1 : .4) : s*.85, legB = p.air != null ? (p.air < 0 ? .7 : -.2) : -s*.85;
    const shoe = () => { shape(g, '#ffffff', rr(g, -5, 13, 14, 7, 3)); g.beginPath(); g.moveTo(-3,17); g.lineTo(7,17); g.lineWidth = 2; g.strokeStyle = '#ff5a7a'; g.stroke(); };
    limb(g, -3, -20, legB, 8, 16, '#33456e', shoe);
    limb(g, -5, -40, p.air != null && p.air < 0 ? -2.7 : -s*.95, 7, 15, '#6b4ad1');
    // hoodie body
    shape(g, '#7c5cff', rr(g, -12, -46, 26, 29, 9));
    shape(g, '#6b4ad1', rr(g, -5, -30, 16, 8, 4), 2.2);
    g.beginPath(); g.moveTo(2,-44); g.lineTo(2,-36); g.moveTo(6,-44); g.lineTo(6,-37); g.lineWidth = 2; g.strokeStyle = '#fff'; g.stroke();
    limb(g, 4, -20, legA, 8, 16, '#3c5080', shoe);
