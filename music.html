<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060f">
<title>Nova Run Soundtrack</title>
<style>
:root{--bg:#07060f;--card:#14122a;--line:#2a2650;--txt:#ecebff;--dim:#9a97c4;--a:#8b7bff;--b:#3ee6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 60% at 50% 0%,#1d1640 0%,var(--bg) 60%);background-color:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,system-ui,sans-serif;min-height:100vh;padding:calc(env(safe-area-inset-top) + 16px) 16px 40px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:.3px}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px}
canvas{width:100%;height:70px;display:block;border-radius:14px;background:#0d0b1f;border:1px solid var(--line);margin-bottom:14px}
.tip{font-size:12px;color:var(--dim);background:#110f24;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:8px}
.t{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;transition:border-color .2s,transform .1s}
.t:active{transform:scale(.985)}
.t.on{border-color:var(--a);box-shadow:0 0 0 1px var(--a),0 0 24px -6px var(--a)}
.pb{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));color:#0a0820;font-size:16px;font-weight:700}
.t .m{flex:1;min-width:0}
.t b{display:block;font-size:15px}
.t span{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t i{font-style:normal;font-size:11px;color:var(--b);flex:none}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin:20px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
button:active{transform:scale(.96)}
button.on{border-color:var(--b);color:var(--b)}
#stop{width:100%;margin-top:14px;background:#211b45}
</style>
</head>
<body>
<h1>Nova Run Soundtrack</h1>
<div class="sub">Preview: original music, made live by Nova (no files, works offline)</div>
<canvas id="viz"></canvas>
<div class="tip">🔈 No sound on iPhone? Flip the silent switch off, turn the volume up, then tap a track.</div>
<div class="list" id="list"></div>
<h2>Try the game effects</h2>
<div class="row">
  <button id="slow">⏳ Slow-mo</button>
  <button id="rush">🏁 Final stretch</button>
</div>
<h2>Sound effects</h2>
<div class="row" id="sfx"></div>
<button id="stop">■ Stop</button>

<script>
const NovaMusic = (() => {
  const SC = [0,2,3,5,7,8,10]; // natural minor
  let ctx, master, lp, comp, an, dsend, vsend, noise, drive, bus;
  let cur = null, step = 0, nextT = 0, timer = null, slow = false, rush = false;

  function init(c){
    ctx = c || new (window.AudioContext || window.webkitAudioContext)();
    comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 6; comp.attack.value = .003; comp.release.value = .15;
    lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 18000;
    master = ctx.createGain(); master.gain.value = .5;
    master.connect(lp); lp.connect(comp); comp.connect(ctx.destination);
    an = ctx.createAnalyser(); an.fftSize = 128; comp.connect(an);
    // echo
    const dl = ctx.createDelay(1), fb = ctx.createGain(), dlp = ctx.createBiquadFilter();
    dl.delayTime.value = .27; fb.gain.value = .38; dlp.type = 'lowpass'; dlp.frequency.value = 2800;
    dsend = ctx.createGain(); dsend.connect(dl); dl.connect(dlp); dlp.connect(fb); fb.connect(dl); dlp.connect(master);
    // reverb
    const cv = ctx.createConvolver(), n = ctx.sampleRate * 2.4, ib = ctx.createBuffer(2, n, ctx.sampleRate);
    for(let ch = 0; ch < 2; ch++){ const d = ib.getChannelData(ch); for(let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 3); }
    cv.buffer = ib; vsend = ctx.createGain(); vsend.connect(cv); cv.connect(master);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noise.getChannelData(0); for(let i = 0; i < nd.length; i++) nd[i] = Math.random()*2-1;
    drive = new Float32Array(1024); for(let i = 0; i < 1024; i++){ const x = i/512 - 1; drive[i] = Math.tanh(x*3.2); }
    bus = master;
  }
  const mf = m => 440 * Math.pow(2, (m-69)/12) * (slow ? .84 : 1);
  function route(node, d = 0, v = 0){
    node.connect(bus);
    if(d){ const s = ctx.createGain(); s.gain.value = d; node.connect(s); s.connect(dsend); }
    if(v){ const s = ctx.createGain(); s.gain.value = v; node.connect(s); s.connect(vsend); }
  }
  function nz(t, len){ const s = ctx.createBufferSource(); s.buffer = noise; s.start(t, Math.random()*.5); s.stop(t+len); return s; }

  // ---- instruments ----
  function kick(t, vol = .9){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(155, t); o.frequency.exponentialRampToValueAtTime(42, t+.13);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+.38);
    o.connect(g); route(g); o.start(t); o.stop(t+.4);
  }
  function snare(t, vol = .5){
    const s = nz(t, .25), hp = ctx.createBiquadFilter(), g = ctx.createGain();
    hp.type = 'highpass'; hp.frequency.value = 1300;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+.2);
    s.connect(hp); hp.connect(g); route(g, 0, .25);
    const o = ctx.createOscillator(), g2 = ctx.createGain(); o.type = 'triangle'; o.frequency.value = 190;
    g2.gain.setValueAtTime(vol*.6, t); g2.gain.exponentialRampToValueAtTime(.001, t+.1);
    o.connect(g2); route(g2); o.start(t); o.stop(t+.12);
  }
  function hat(t, vol = .14, open = false){
    const len = open ? .18 : .045, s = nz(t, len+.02), hp = ctx.createBiquadFilter(), g = ctx.createGain();
    hp.type = 'highpass'; hp.frequency.value = 7200;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+len);
    s.connect(hp); hp.connect(g); route(g);
  }
  function tone(t, m, len, o = {}){
    const f = mf(m), g = ctx.createGain(), fl = ctx.createBiquadFilter();
    const a = o.att || .006, r = o.rel || .09, vol = o.vol || .18, cut = (o.cut || 4000) * (slow ? .6 : 1);
    fl.type = 'lowpass'; fl.Q.value = o.q || 1;
    fl.frequency.setValueAtTime(cut * (o.fenv || 1), t);
    fl.frequency.exponentialRampToValueAtTime(cut, t + Math.min(len, .25) + .01);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+a);
    if(o.sus != null) g.gain.setTargetAtTime(vol*o.sus, t+a, (o.dec || .2)/3);
    g.gain.setTargetAtTime(0, t+len, r/3);
    let last = fl;
    if(o.dist){ const ws = ctx.createWaveShaper(); ws.curve = drive; fl.connect(ws); last = ws; }
    last.connect(g); route(g, o.d || 0, o.v || 0);
    (o.det || [0]).forEach(dt => {
      const osc = ctx.createOscillator(); osc.type = o.type || 'sawtooth'; osc.detune.value = dt;
      if(o.glide){ osc.frequency.setValueAtTime(f*o.glide, t); osc.frequency.exponentialRampToValueAtTime(f, t+.06); }
      else osc.frequency.setValueAtTime(f, t);
      if(o.vib){ const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = 5.5; lg.gain.value = o.vib; l.connect(lg); lg.connect(osc.detune); l.start(t); l.stop(t+len+r*2); }
      osc.connect(fl); osc.start(t); osc.stop(t+len+r*2.5);
    });
  }

  // ---- tracks ----
  const D = (k) => ({ kick:'x...x...x...x...', snare:'....x.......x...', ...k });
  const TRACKS = {
    menu: { name:'Standby Glow', vibe:'Menu · calm, dreamy synth pads', bpm:90, root:45, chords:[5,2,3,0], sev:true,
      hat:'........x.......', hatV:.05, bass:'x---------------', bassV:{type:'triangle',vol:.22,cut:600,rel:.6},
      pad:{oct:12,type:'sawtooth',det:[-9,9],vol:.045,cut:1100,att:.9,rel:1.4,v:.5},
      arp:{rate:4,oct:24,type:'triangle',vol:.07,cut:3000,rel:.4,d:.5,v:.3},
      lead:'9-------7-------6-------4-------7-------8-------7---------------', leadV:{type:'sine',vol:.09,att:.02,rel:.8,d:.35,v:.4}, kick:null, snare:null },
    cruise: D({ name:'Neon Commute', vibe:'Level 1 · chill synthwave, bouncy bass', bpm:110, root:45, chords:[0,5,2,6],
      hat:'..x...x...x...x.', bass:'x.o.x.o.x.o.x.o.', bassV:{type:'sawtooth',vol:.2,cut:700,fenv:3,q:4,rel:.08},
      pad:{oct:12,type:'sawtooth',det:[-10,10],vol:.035,cut:1400,att:.3,rel:.6,v:.4},
      arp:{rate:2,oct:24,type:'square',vol:.045,cut:2600,rel:.06,d:.35},
      lead:'4---3-2-0---2-3-5---4-3-2-------4---4-5-7---5-4-6---5-4-3---1---', leadV:{type:'sawtooth',det:[-7,7],vol:.08,cut:3200,att:.02,rel:.25,vib:12,d:.3,v:.2} }),
    warp: D({ name:'Lightspeed Lane', vibe:'Level 2 · upbeat retro arcade', bpm:124, root:40, chords:[0,2,6,5],
      kick:'x...x...x...x.x.', hat:'xxxxxxxxxxxxxxxx', hatV:.08, bass:'x.xo.xx.x.xo.x5.', bassV:{type:'square',vol:.13,cut:900,fenv:2,rel:.05},
      arp:{rate:1,oct:24,type:'square',vol:.03,cut:4000,rel:.03,d:.2},
      lead:'0.2.4.7.4.2.0.4.2.4.6.9.6.4.2.6.6.8.a.8.6.4.6.8.7---6---4---2-1-', leadV:{type:'square',vol:.07,cut:5000,rel:.06,d:.25} }),
    nebula: D({ name:'Purple Static', vibe:'Level 3 · spacey, mysterious, echoey', bpm:128, root:38, chords:[0,5,6,0],
      kick:'x.........x.....', snare:'........x.......', hat:'..x...x...x...xx', bass:'x-------5---o---', bassV:{type:'sawtooth',vol:.2,cut:500,q:6,fenv:4,rel:.2},
      pad:{oct:12,type:'sawtooth',det:[-14,0,14],vol:.03,cut:900,att:1,rel:1.5,v:.6},
      arp:{rate:1,oct:24,type:'triangle',vol:.06,cut:3500,rel:.08,d:.6,v:.3},
      lead:'7-------4-------5-------3-------6-------8-------7---------------', leadV:{type:'sine',vol:.1,att:.15,rel:1,vib:20,d:.5,v:.5} }),
    hyper: D({ name:'Overclocked', vibe:'Level 4 · driving electro, tension', bpm:140, root:42, chords:[0,3,5,6], fill:true,
      snare:'....x.......x..x', hat:'x.xxx.xxx.xxx.xx', hatV:.1, bass:'xxoxxxoxxxoxxxox', bassV:{type:'sawtooth',vol:.15,cut:800,fenv:3,q:3,rel:.04,dist:true},
      pad:{oct:12,type:'sawtooth',det:[-8,8],vol:.03,cut:1800,att:.1,rel:.3},
      arp:{rate:2,oct:24,type:'sawtooth',vol:.04,cut:3000,rel:.05,d:.3},
      lead:'0-0-3-0-4-0-3-2-3-3-5-3-7-5-3-2-5-5-7-5-8-7-5-4-6-6-8-6-9---8-7-', leadV:{type:'sawtooth',det:[-6,6],vol:.07,cut:3800,rel:.1,glide:.97,d:.25} }),
    horizon: D({ name:'No Way Back', vibe:'Level 5 · dark, heavy bass, frantic', bpm:155, root:36, chords:[0,5,3,4], fill:true,
      kick:'x..x..x...x..x..', hat:'x.x.x.x.x.x.x.x.', hatV:.12, bass:'xx.xx.x.xx.xx5o.', bassV:{type:'sawtooth',det:[-12,12],vol:.16,cut:650,fenv:4,q:5,rel:.05,dist:true},
      pad:{oct:12,type:'sawtooth',det:[-15,15],vol:.03,cut:1200,att:.2,rel:.5,v:.3},
      arp:{rate:1,oct:24,type:'square',vol:.03,cut:2400,rel:.03,d:.2},
      lead:'7---6---7---4---5-------3---4---3---5---6---7---8-------7-6-4---', leadV:{type:'sawtooth',vol:.08,cut:2600,q:6,att:.03,rel:.2,vib:30,d:.3,v:.2} }),
    shield: { name:'Shield Up!', vibe:'Sting · plays when you go invincible', sting:true },
    respawn:{ name:'Respawn', vibe:'Sting · game over jingle', sting:true }
  };
  const idx = (T, i) => T.root + SC[((i%7)+7)%7] + 12*Math.floor(i/7);
  function chord(T, deg){ const c = [idx(T,deg), idx(T,deg+2), idx(T,deg+4)]; if(T.sev) c.push(idx(T,deg+6)); return c; }
  function parseLead(T){
    const map = {}, s = T.lead || '';
    for(let i = 0; i < s.length; i++){
      const ch = s[i]; if(ch === '-' || ch === '.') continue;
      let len = 1; while(s[i+len] === '-') len++;
      map[i] = [idx(T, parseInt(ch, 36)) + 24, len];
    }
    T._lead = map; T._ll = s.length || 64;
  }
  Object.values(TRACKS).forEach(T => { if(!T.sting) parseLead(T); });

  const sd = T => 60 / (T.bpm * (slow ? .6 : 1) * (rush ? 1.12 : 1)) / 4;
  function sched(T, s, t){
    const nb = T.chords.length, bar = Math.floor(s/16) % nb, i = s % 16, d = sd(T);
    const ch = chord(T, T.chords[bar]), r = ch[0];
    if(T.kick && T.kick[i] === 'x') kick(t);
    if(T.snare && T.snare[i] === 'x') snare(t);
    if(T.fill && bar === nb-1 && i >= 12 && Math.floor(s/16) % (nb*2) === nb*2-1) snare(t, .2 + (i-12)*.08);
    if(T.hat && T.hat[i] === 'x') hat(t, (T.hatV || .12) * (i%4 === 2 ? 1.3 : 1));
    const b = T.bass && T.bass[i];
    if(b && b !== '.' && b !== '-'){
      let len = 1; while(T.bass[i+len] === '-') len++;
      tone(t, r + (b === 'o' ? 12 : b === '5' ? 7 : 0), len*d*.9, T.bassV);
    }
    if(T.pad && i === 0) ch.forEach(m => tone(t, m + T.pad.oct, 16*d, T.pad));
    if(T.arp && i % T.arp.rate === 0){ const k = Math.floor(s / T.arp.rate); tone(t, ch[k % ch.length] + T.arp.oct + (k % (ch.length*2) >= ch.length ? 12 : 0), T.arp.rate*d*.8, T.arp); }
    const L = T._lead[s % T._ll]; if(L) tone(t, L[0], L[1]*d*.92, T.leadV);
  }

  // ---- stings + sfx ----
  const STINGS = {
    shield(t){
      [72,76,79,84,88,91,96].forEach((m,k) => {
        tone(t+k*.055, m, .18, {type:'triangle',vol:.12,rel:.3,d:.4,v:.4});
        tone(t+k*.055, m+12, .08, {type:'square',vol:.03,cut:6000,rel:.1});
      });
      const s = nz(t, 1), hp = ctx.createBiquadFilter(), g = ctx.createGain(); hp.type = 'highpass'; hp.frequency.value = 9000;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.06, t+.4); g.gain.exponentialRampToValueAtTime(.001, t+1);
      s.connect(hp); hp.connect(g); route(g, 0, .6);
      tone(t+.4, 84, .6, {type:'sine',vol:.1,rel:.8,vib:25,v:.5});
    },
    respawn(t){
      [[67,.28],[66,.28],[65,.28],[64,1]].forEach(([m,len],k) =>
        tone(t+k*.32, m-12, len, {type:'sawtooth',det:[-6,6],vol:.14,cut:k===3?900:1400,q:5,att:.02,rel:.2,vib:k===3?45:0,v:.2}));
      tone(t+1.75, 84, .06, {type:'square',vol:.07,glide:.5,rel:.05});
      tone(t+1.85, 91, .1, {type:'square',vol:.07,rel:.1,d:.3});
    }
  };
  const SFX = {
    'Whoosh': t => { const s = nz(t, .45), bp = ctx.createBiquadFilter(), g = ctx.createGain(); bp.type = 'bandpass'; bp.Q.value = 2;
      bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(3500, t+.3);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5, t+.08); g.gain.exponentialRampToValueAtTime(.001, t+.42);
      s.connect(bp); bp.connect(g); route(g, 0, .2); },
    'Power-up': t => { tone(t, 81, .07, {type:'square',vol:.09,rel:.04}); tone(t+.07, 88, .14, {type:'square',vol:.09,rel:.12,d:.3}); },
    'Jump': t => tone(t, 64, .14, {type:'square',vol:.08,glide:.6,rel:.06}),
    'Crash': t => { kick(t, 1); const s = nz(t, .6), lpf = ctx.createBiquadFilter(), g = ctx.createGain(); lpf.type = 'lowpass';
      lpf.frequency.setValueAtTime(3000, t); lpf.frequency.exponentialRampToValueAtTime(200, t+.5);
      g.gain.setValueAtTime(.6, t); g.gain.exponentialRampToValueAtTime(.001, t+.55); s.connect(lpf); lpf.connect(g); route(g, 0, .3); },
    'Level clear': t => [72,76,79,84].forEach((m,k) => tone(t+k*.1, m, k===3?.5:.09, {type:'square',vol:.07,cut:5000,rel:.2,d:.3}))
  };

  function ensure(){
    if(!ctx){ init(); try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){} }
    if(ctx.state !== 'running') ctx.resume();
  }
  function newBus(){ const g = ctx.createGain(); g.connect(master); bus = g; return g; }
  function tick(){ while(nextT < ctx.currentTime + .15){ sched(cur, step, nextT); nextT += sd(cur); step++; } }
  function stop(){
    clearInterval(timer); timer = null; cur = null;
    if(bus && bus !== master && ctx){ const b = bus; b.gain.setTargetAtTime(0, ctx.currentTime, .05); setTimeout(() => b.disconnect(), 400); }
  }
  function play(id){
    ensure(); stop(); newBus(); const T = TRACKS[id];
    if(T.sting){ STINGS[id](ctx.currentTime + .05); return; }
    cur = T; step = 0; nextT = ctx.currentTime + .06; tick(); timer = setInterval(tick, 25);
  }
  function sfx(name){ ensure(); const prev = bus; bus = master; SFX[name](ctx.currentTime + .02); bus = prev; }
  function setSlow(v){ slow = v; if(ctx) lp.frequency.setTargetAtTime(v ? 1600 : 18000, ctx.currentTime, .15); }
  function setRush(v){ rush = v; }
  // offline render for testing: returns RMS of the rendered audio
  async function render(id, sec = 4){
    const off = new OfflineAudioContext(2, 44100*sec, 44100); init(off); bus = master;
    const T = TRACKS[id];
    if(T.sting) STINGS[id](.05); else { let t = .05, s = 0; while(t < sec - .2){ sched(T, s++, t); t += sd(T); } }
    const buf = await off.startRendering(), d = buf.getChannelData(0);
    let sum = 0, pk = 0; for(let i = 0; i < d.length; i++){ sum += d[i]*d[i]; pk = Math.max(pk, Math.abs(d[i])); }
    ctx = null; return { rms: Math.sqrt(sum/d.length), peak: pk };
  }
  return { TRACKS, SFX, play, stop, sfx, setSlow, setRush, render, get playing(){ return cur && Object.keys(TRACKS).find(k => TRACKS[k] === cur); }, get analyser(){ return an; } };
})();

// ---- UI ----
const $ = id => document.getElementById(id);
const order = ['menu','cruise','warp','nebula','hyper','horizon','shield','respawn'];
let on = null;
order.forEach(id => {
  const T = NovaMusic.TRACKS[id], el = document.createElement('div');
  el.className = 't'; el.dataset.id = id;
  el.innerHTML = `<div class="pb">▶</div><div class="m"><b>${T.name}</b><span>${T.vibe}</span></div><i>${T.bpm ? T.bpm + ' BPM' : 'sting'}</i>`;
  el.onclick = () => {
    if(on === id && !T.sting){ NovaMusic.stop(); mark(null); return; }
    NovaMusic.play(id); mark(T.sting ? null : id);
    if(T.sting){ el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1600); }
  };
  $('list').appendChild(el);
});
function mark(id){ on = id; document.querySelectorAll('.t').forEach(e => { const a = e.dataset.id === id; e.classList.toggle('on', a); e.querySelector('.pb').textContent = a ? '❚❚' : '▶'; }); }
Object.keys(NovaMusic.SFX).forEach(n => { const b = document.createElement('button'); b.textContent = n; b.onclick = () => NovaMusic.sfx(n); $('sfx').appendChild(b); });
$('slow').onclick = e => { const v = !e.currentTarget.classList.contains('on'); e.currentTarget.classList.toggle('on', v); NovaMusic.setSlow(v); };
$('rush').onclick = e => { const v = !e.currentTarget.classList.contains('on'); e.currentTarget.classList.toggle('on', v); NovaMusic.setRush(v); };
$('stop').onclick = () => { NovaMusic.stop(); mark(null); };

const cv = $('viz'), cx = cv.getContext('2d');
function draw(){
  const w = cv.width = cv.clientWidth * 2, h = cv.height = cv.clientHeight * 2;
  cx.clearRect(0, 0, w, h);
  const an = NovaMusic.analyser, n = 48, bw = w / n;
  let data = null; if(an){ data = new Uint8Array(an.frequencyBinCount); an.getByteFrequencyData(data); }
  for(let i = 0; i < n; i++){
    const v = data ? data[Math.floor(i * data.length / n * .8)] / 255 : 0;
    const bh = Math.max(4, v * h * .9), g = cx.createLinearGradient(0, h, 0, h - bh);
    g.addColorStop(0, '#8b7bff'); g.addColorStop(1, '#3ee6ff');
    cx.fillStyle = g; cx.globalAlpha = .35 + v * .65;
    cx.fillRect(i*bw + 2, (h - bh) / 2, bw - 4, bh);
  }
  requestAnimationFrame(draw);
}
